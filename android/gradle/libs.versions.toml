# Versioni allineate al progetto treni (C:\Workspace\treni), già collaudato con questa toolchain.
[versions]
agp = "9.3.2"
kotlin = "2.2.10"   # imposta da AGP 9.3.2 (built-in Kotlin)
composeBom = "2026.08.00"
coreKtx = "1.19.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.10.0"
serialization = "1.11.0"
biometric = "1.1.0"   # ultima stabile (la 1.4 è ancora beta)
fragment = "1.9.1"    # FragmentActivity per BiometricPrompt; rialza la vecchia che biometric si porta dietro
coroutines = "1.11.0"
ksp = "2.3.11"        # versionamento indipendente: compatibile con AGP 9 built-in Kotlin (come treni)
room = "2.8.4"
okhttp = "5.5.0"
camerax = "1.6.2"    # registrazione del video della timbratura (VideoCapture, senza audio)
work = "2.12.0"      # invio della coda delle timbrature con il vincolo di rete
bouncycastle = "1.79"  # solo nei test: verifica il CSR costruito a mano in :core
junit = "4.13.2"

[libraries]
androidx-core-ktx           = { module = "androidx.core:core-ktx",                       version.ref = "coreKtx" }
androidx-activity-compose   = { module = "androidx.activity:activity-compose",           version.ref = "activityCompose" }
androidx-lifecycle-vm       = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime  = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose",       version.ref = "navigation" }
compose-bom                 = { module = "androidx.compose:compose-bom",                 version.ref = "composeBom" }
compose-ui                  = { module = "androidx.compose.ui:ui" }
compose-ui-graphics         = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling          = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview  = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3           = { module = "androidx.compose.material3:material3" }
androidx-biometric          = { module = "androidx.biometric:biometric",                 version.ref = "biometric" }
androidx-fragment           = { module = "androidx.fragment:fragment-ktx",               version.ref = "fragment" }
kotlinx-serialization-json  = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core     = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android  = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
junit                       = { module = "junit:junit",                                  version.ref = "junit" }
room-runtime                = { module = "androidx.room:room-runtime",                   version.ref = "room" }
room-ktx                    = { module = "androidx.room:room-ktx",                       version.ref = "room" }
room-compiler               = { module = "androidx.room:room-compiler",                  version.ref = "room" }
okhttp                      = { module = "com.squareup.okhttp3:okhttp",                  version.ref = "okhttp" }
camera-core                 = { module = "androidx.camera:camera-core",                  version.ref = "camerax" }
camera-camera2              = { module = "androidx.camera:camera-camera2",               version.ref = "camerax" }
camera-lifecycle            = { module = "androidx.camera:camera-lifecycle",             version.ref = "camerax" }
camera-video                = { module = "androidx.camera:camera-video",                 version.ref = "camerax" }
camera-view                 = { module = "androidx.camera:camera-view",                  version.ref = "camerax" }
work-runtime                = { module = "androidx.work:work-runtime-ktx",               version.ref = "work" }
bcpkix                      = { module = "org.bouncycastle:bcpkix-jdk18on",              version.ref = "bouncycastle" }

[plugins]
android-application = { id = "com.android.application",                 version.ref = "agp" }
kotlin-jvm          = { id = "org.jetbrains.kotlin.jvm",                version.ref = "kotlin" }
kotlin-serialization= { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler    = { id = "org.jetbrains.kotlin.plugin.compose",     version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp",                 version.ref = "ksp" }
